<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Origna Ventures - Software services, ecommerce, retail, wholesale, and launch packages.">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Origna Ventures">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Origna Ventures</title>

  <style id="splash-screen-style">
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #08081A;
      overscroll-behavior: none;
    }

    body {
      overflow: hidden;
      position: fixed;
      inset: 0;
      touch-action: pan-x pan-y;
    }

    flutter-view,
    flt-glass-pane,
    [flt-glass-pane] {
      width: 100%;
      height: 100%;
      overscroll-behavior: none !important;
      touch-action: pan-x pan-y;
    }

    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at top right, rgba(212, 160, 23, 0.16), transparent 28%),
        radial-gradient(circle at bottom left, rgba(63, 167, 214, 0.14), transparent 28%),
        linear-gradient(160deg, #08111F 0%, #14213D 55%, #1B335C 100%);
      transition: opacity 220ms ease;
    }

    #splash.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .splash-shell {
      width: min(88vw, 420px);
      text-align: center;
      color: white;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .splash-logo-wrap {
      width: 92px;
      height: 92px;
      margin: 0 auto 24px;
      border-radius: 24px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #14213D, #3FA7D6, #D4A017);
      box-shadow:
        0 20px 50px rgba(99, 102, 241, 0.26),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
    }

    .splash-logo {
      width: 54px;
      height: 54px;
      object-fit: contain;
      filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.18));
    }

    .splash-title {
      margin: 0;
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.96);
    }

    .splash-copy {
      margin: 12px auto 0;
      max-width: 340px;
      font-size: 13px;
      line-height: 1.5;
      color: rgba(255, 255, 255, 0.58);
      letter-spacing: 0.01em;
    }

    .splash-bar {
      width: min(70vw, 240px);
      height: 4px;
      margin: 20px auto 0;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.10);
    }

    .splash-bar::before {
      content: "";
      display: block;
      width: 50%;
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #14213D, #3FA7D6, #D4A017);
      animation: splash-load 1.2s ease-in-out infinite;
    }

    @keyframes splash-load {
      0% {
        transform: translateX(-100%);
      }
      100% {
        transform: translateX(300%);
      }
    }
  </style>

  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      const splash = document.getElementById("splash");
      if (!splash) return;
      splash.classList.add("fade-out");
      setTimeout(() => splash.remove(), 240);
    }

    function applyOverscrollGuards() {
      const targets = [
        document.documentElement,
        document.body,
        document.querySelector('flutter-view'),
        document.querySelector('flt-glass-pane'),
        document.querySelector('[flt-glass-pane]'),
      ].filter(Boolean);
      for (const target of targets) {
        target.style.overscrollBehavior = 'none';
        target.style.webkitOverflowScrolling = 'auto';
      }
    }

    setTimeout(() => {
      applyOverscrollGuards();
      removeSplashFromWeb();
    }, 3000);
    window.addEventListener("flutter-first-frame", () => {
      applyOverscrollGuards();
      removeSplashFromWeb();
    });
    window.addEventListener("pageshow", () => {
      applyOverscrollGuards();
      removeSplashFromWeb();
    });

    const observer = new MutationObserver(() => applyOverscrollGuards());
    observer.observe(document.documentElement, { childList: true, subtree: true });
    applyOverscrollGuards();

    let touchStartY = 0;
    window.addEventListener("touchstart", (event) => {
      if (event.touches.length !== 1) return;
      touchStartY = event.touches[0].clientY;
    }, { passive: true });

    window.addEventListener("touchmove", (event) => {
      if (event.touches.length !== 1) return;
      const deltaY = touchStartY - event.touches[0].clientY;
      if (shouldBlockViewportOverscroll(deltaY)) {
        event.preventDefault();
      }
    }, { passive: false });

    window.addEventListener("wheel", (event) => {
      if (shouldBlockViewportOverscroll(event.deltaY)) {
        event.preventDefault();
      }
    }, { passive: false });

    function shouldBlockViewportOverscroll(deltaY) {
      const scroller = document.scrollingElement || document.documentElement;
      if (!scroller) return false;
      const scrollingDown = deltaY > 0;
      const scrollingUp = deltaY < 0;
      const atTop = scroller.scrollTop <= 0;
      const atBottom = Math.ceil(scroller.scrollTop + window.innerHeight) >= scroller.scrollHeight;
      return (scrollingUp && atTop) || (scrollingDown && atBottom);
    }
  </script>
</head>
<body>
  <div id="splash">
    <div class="splash-shell">
      <div class="splash-logo-wrap">
        <picture>
          <source srcset="splash/img/light-1x.png 1x, splash/img/light-2x.png 2x, splash/img/light-3x.png 3x, splash/img/light-4x.png 4x" media="(prefers-color-scheme: light)">
          <source srcset="splash/img/dark-1x.png 1x, splash/img/dark-2x.png 2x, splash/img/dark-3x.png 3x, splash/img/dark-4x.png 4x" media="(prefers-color-scheme: dark)">
          <img class="splash-logo" src="splash/img/light-1x.png" alt="Origna Ventures">
        </picture>
      </div>
      <h1 class="splash-title">Origna Ventures</h1>
      <p class="splash-copy">Software services, ecommerce, wholesale, retail, and launch packages.</p>
      <div class="splash-bar"></div>
    </div>
  </div>

  <script>
    {{flutter_js}}
    {{flutter_build_config}}

    _flutter.loader.load({
      onEntrypointLoaded: async function(engineInitializer) {
        const appRunner = await engineInitializer.initializeEngine();
        await appRunner.runApp();
      }
    });
  </script>
</body>
</html>
