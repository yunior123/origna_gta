name: Schema Sync

on:
  push:
    branches: [main, develop]
    paths:
      - 'functions/config.py'
      - 'functions/schema_constants.py'
  pull_request:
    branches: [main, develop]
    paths:
      - 'functions/config.py'
      - 'functions/schema_constants.py'

jobs:
  schema-sync:
    name: Sync Schema Constants
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sync Schema
        run: |
          echo "🔄 Syncing schema constants from Python to Dart..."
          python scripts/sync_schema.py
          
      - name: Check for Changes
        id: check-changes
        run: |
          if git diff --quiet origna_gta/lib/core/schema/schema_constants.dart; then
            echo "✅ Schema is already up to date"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "📝 Schema constants updated"
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
          
      - name: Commit Changes (Push to Main)
        if: steps.check-changes.outputs.changed == 'true' && github.event_name == 'push'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add origna_gta/lib/core/schema/schema_constants.dart
          git commit -m "chore: auto-sync schema constants from Python

          Updated Dart schema constants to match Python backend:
          - OrderStatusValues
          - PaymentStatusValues
          - DeliveryStatusValues
          - UserRoleValues
          - BusinessRules
          
          Auto-generated by schema-sync.yml"
          git push
          
      - name: Comment on PR (if changes needed)
        if: steps.check-changes.outputs.changed == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🔄 **Schema Sync Required**
              
              The Python schema constants have been updated. The Dart file needs to be synced.
              
              The automated sync will happen when this PR is merged to main/develop.
              
              If you need to sync now, run:
              \`\`\`bash
              python scripts/sync_schema.py
              \`\`\`
              
              And commit the changes.`
            })
            
      - name: Verify No Breaking Changes
        run: |
          echo "🔍 Verifying Flutter code compiles after schema sync..."
          cd origna_gta
          flutter pub get
          flutter analyze --fatal-infos
