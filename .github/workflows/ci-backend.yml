name: CI — Backend Tests

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  backend-removed:
    name: backend removed
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Skip obsolete backend workflow
        run: |
          echo "functions/ was removed from this repository."
          echo "Backend Python CI is intentionally disabled for this checkout."
      # Requires MAIL_USERNAME and MAIL_PASSWORD secrets to be configured in GitHub repository settings
      - name: Notify on failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "❌ CI Failed: ${{ github.workflow }} on ${{ github.ref }}"
          to: support@orignagta.ca
          cc: yuniorrodriguezo460@gmail.com
          from: GitHub Actions <${{ secrets.MAIL_USERNAME }}>
          body: |
            Workflow: ${{ github.workflow }}
            Branch: ${{ github.ref }}
            Commit: ${{ github.sha }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
