name: CI — Backend Tests

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  backend-removed:
    name: backend removed
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Skip obsolete backend workflow
        run: |
          echo "functions/ was removed from this repository."
          echo "Backend Python CI is intentionally disabled for this checkout."
