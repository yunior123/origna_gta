name: CI — OrignaBase Rust

on:
  push:
    branches: ["main"]
    paths: ['orignabase/**', '.github/workflows/ci-rust.yml']
  pull_request:
    branches: ["main"]
    paths: ['orignabase/**', '.github/workflows/ci-rust.yml']

jobs:
  rust-checks:
    name: Rust Clippy + Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: orignabase -> target
      - name: Clippy
        run: cd orignabase && cargo clippy -- -D warnings
      - name: Unit tests
        env:
          OB_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_db
        run: cd orignabase && cargo test
      - name: Notify on failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "❌ CI Failed: OrignaBase Rust on ${{ github.ref }}"
          to: support@orignagta.ca
          from: GitHub Actions <${{ secrets.MAIL_USERNAME }}>
          body: |
            Workflow: ${{ github.workflow }}
            Branch: ${{ github.ref }}
            Commit: ${{ github.sha }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
