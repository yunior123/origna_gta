name: CI — Flutter Web Build

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  build:
    name: Flutter Web Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Checkout OrignaBase dependency
        uses: actions/checkout@v4
        with:
          repository: yunior123/orignabase
          token: ${{ secrets.ORIGNABASE_REPO_TOKEN }}
          path: orignabase

      - name: Expose OrignaBase at expected sibling path
        run: ln -sfn "$GITHUB_WORKSPACE/orignabase" "$GITHUB_WORKSPACE/../orignabase"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable
          cache: true

      - name: Build Flutter web (debug, dev env)
        run: |
          cd origna_gta
          flutter build web --debug \
            --dart-define=ENVIRONMENT=dev \
            --dart-define=ORIGNABASE_URL=https://api.dev.orignagta.ca
        env:
          FLUTTER_WEB_USE_SKIA: "true"

      - name: Flutter analyze
        run: cd origna_gta && flutter analyze --no-fatal-infos

      - name: Flutter tests
        run: cd origna_gta && flutter test --reporter=compact --exclude-tags golden

      # Requires MAIL_USERNAME and MAIL_PASSWORD secrets to be configured in GitHub repository settings
      - name: Notify on failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "❌ CI Failed: Flutter Web Build on ${{ github.ref }}"
          to: support@orignagta.ca
          cc: yuniorrodriguezo460@gmail.com
          from: GitHub Actions <${{ secrets.MAIL_USERNAME }}>
          body: |
            Workflow: ${{ github.workflow }}
            Branch: ${{ github.ref }}
            Commit: ${{ github.sha }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
