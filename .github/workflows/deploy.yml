name: Deploy to Firebase

on:
  push:
    branches: [main]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java (Firebase emulators)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Flutter setup
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # Python setup
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: functions/requirements.txt

      # Node.js setup (for Playwright)
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm i -g firebase-tools@latest

    
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      # Install Python dependencies
      - name: Install Python dependencies
        run: |
          cd functions
          pip install -r requirements.txt
          pip install pytest


      # Flutter analyze
      - name: Flutter analyze
        run: |
          cd origna_gta
          flutter pub get
          flutter analyze

      # Flutter tests
      - name: Flutter tests
        run: |
          cd origna_gta
          flutter test

      # Dart unit tests
      - name: Dart unit tests
        run: |
          cd origna_gta
          flutter test test/unit/

      # Python tests
      - name: Python tests
        run: |
          cd functions
          python -m pytest tests/ -v --tb=short

      # Build Flutter web (Required for E2E)
      - name: Build Flutter web
        run: |
          cd origna_gta
          flutter build web --release


      # Deploy to Firebase (Hosting + Functions + Firestore)
      # Uses GITHUB_TOKEN (auto-provided) and FIREBASE_SERVICE_ACCOUNT (must be configured)
      - name: Deploy Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}  # Auto-provided by GitHub
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}  # Required: Firebase service account JSON
          channelId: live
          projectId: orignagta

      # Deploy Cloud Functions (requires FIREBASE_SERVICE_ACCOUNT)
      - name: Deploy Firebase Functions
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only functions --force
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}  # Required: Firebase service account JSON

      # Deploy Firestore Rules (requires FIREBASE_SERVICE_ACCOUNT)
      - name: Deploy Firestore Rules
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only firestore:rules
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}  # Required: Firebase service account JSON

      # Deploy Firestore Indexes (requires FIREBASE_SERVICE_ACCOUNT)
      - name: Deploy Firestore Indexes
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only firestore:indexes
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}  # Required: Firebase service account JSON

      - name: Deployment Summary
        run: |
          echo "✅ Firebase Hosting deployed"
          echo "✅ Cloud Functions deployed"
          echo "✅ Firestore Rules deployed"
          echo "✅ Firestore Indexes deployed"
