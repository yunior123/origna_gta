name: Deploy to Firebase

on:
  push:
    branches: [main]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    env:
      # Force config.py to load from env vars (not Secret Manager)
      FUNCTIONS_EMULATOR: 'true'
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      MAILJET_API_KEY: ${{ secrets.MAILJET_API_KEY }}
      MAILJET_SECRET_KEY: ${{ secrets.MAILJET_SECRET_KEY }}
      GEOAPIFY_API_KEY: ${{ secrets.GEOAPIFY_API_KEY }}
      ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
      ALGOLIA_WRITE_API_KEY: ${{ secrets.ALGOLIA_WRITE_API_KEY }}
      AIRWALLEX_API_KEY: ${{ secrets.AIRWALLEX_API_KEY }}
      AIRWALLEX_CLIENT_ID: ${{ secrets.AIRWALLEX_CLIENT_ID }}
      AIRWALLEX_WEBHOOK_SECRET: ${{ secrets.AIRWALLEX_WEBHOOK_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java (Firebase emulators)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Flutter setup
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # Python setup
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: functions/requirements.txt

      # Node.js setup (for Playwright)
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm i -g firebase-tools@latest

      # Install Python dependencies
      - name: Install Python dependencies
        run: |
          cd functions
          pip install -r requirements.txt
          pip install pytest

      # Install Playwright dependencies
      - name: Install Playwright dependencies
        run: |
          cd e2e
          npm ci
          npx playwright install --with-deps

      # Flutter analyze
      - name: Flutter analyze
        run: |
          cd origna_gta
          flutter pub get
          flutter analyze

      # Flutter tests
      - name: Flutter tests
        run: |
          cd origna_gta
          flutter test

      # Dart unit tests
      - name: Dart unit tests
        run: |
          cd origna_gta
          flutter test test/unit/

      # Python tests
      - name: Python tests
        run: |
          cd functions
          python -m pytest tests/ -v --tb=short

      # Build Flutter web (Required for E2E)
      - name: Build Flutter web
        run: |
          cd origna_gta
          flutter build web --release

      - name: Start E2E services
        run: ./start-e2e-services.sh --no-wait

      # Playwright E2E tests (stable suites only)
      - name: Playwright E2E tests
        run: |
          E2E_WORKERS=2 ./run-e2e-tests.sh flutter

      - name: Stop E2E services
        if: always()
        run: ./stop-e2e-services.sh

      # Deploy to Firebase (Hosting + Functions + Firestore)
      - name: Deploy Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: orignagta

      - name: Deploy Firebase Functions
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only functions --force
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Firestore Rules
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only firestore:rules
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Firestore Indexes
        uses: w9jds/firebase-action@master
        with:
          args: deploy --only firestore:indexes
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deployment Summary
        run: |
          echo "✅ Firebase Hosting deployed"
          echo "✅ Cloud Functions deployed"
          echo "✅ Firestore Rules deployed"
          echo "✅ Firestore Indexes deployed"
