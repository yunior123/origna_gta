name: E2E Tests (agent-browser + Bun)

on:
  push:
    branches: [main]
    paths:
      - 'e2e-agent-browser/**'
      - 'origna_gta/lib/**'
      - 'orignabase/**'
      - '.github/workflows/cd-e2e.yml'
  workflow_dispatch:

env:
  E2E_TARGET_URL: https://dev.orignagta.ca
  ORIGNABASE_URL: https://api.dev.orignagta.ca

jobs:
  flutter-checks:
    name: Flutter Analyze + Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: cd origna_gta && flutter pub get
      - run: cd origna_gta && flutter analyze --no-fatal-infos
      - run: cd origna_gta && flutter test --exclude-tags golden

  e2e-api:
    name: API Tests (no browser)
    needs: flutter-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: cd e2e-agent-browser && bun install --frozen-lockfile
      - name: Run Phase 1 API tests
        run: cd e2e-agent-browser && bun test specs/phase1-api/ --timeout 60000

  e2e-ui:
    name: UI Tests
    needs: e2e-api
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install agent-browser
        run: npm install -g agent-browser && agent-browser install
      - run: cd e2e-agent-browser && bun install --frozen-lockfile
      - name: Run UI tests (sequential phases)
        run: cd e2e-agent-browser && chmod +x run-tests.sh && ./run-tests.sh all

  deploy-dev:
    name: Deploy to Dev
    needs: [e2e-api]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build Flutter web
        run: |
          cd origna_gta
          flutter pub get
          flutter build web --debug \
            --dart-define=ENVIRONMENT=dev \
            --dart-define=ORIGNABASE_URL=https://api.dev.orignagta.ca \
            --dart-define=FORCE_SEMANTICS=true
      - name: Deploy to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          source: origna_gta/build/web/
          target: /var/www/orignagta/dev/current/
          strip_components: 3
