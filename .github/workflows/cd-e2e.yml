name: CD — Deploy Dev + E2E Tests

on:
  push:
    branches: ["main"]

concurrency:
  group: cd-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────
  # Job 1: Flutter analyze + unit tests (fast gate)
  # ────────────────────────────────────────────────────────────
  flutter-checks:
    name: Flutter Analyze + Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Checkout OrignaBase SDK
        uses: actions/checkout@v4
        with:
          repository: yunior123/orignabase
          token: ${{ secrets.ORIGNABASE_REPO_TOKEN }}
          path: orignabase

      - name: Symlink OrignaBase at sibling path
        run: ln -sfn "$GITHUB_WORKSPACE/orignabase" "$GITHUB_WORKSPACE/../orignabase"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable
          cache: true

      - name: Flutter analyze
        run: cd origna_gta && flutter analyze --no-fatal-infos

      - name: Flutter tests
        run: cd origna_gta && flutter test --reporter=compact --exclude-tags golden

  # ────────────────────────────────────────────────────────────
  # Job 2: Build Flutter web + deploy to dev VPS
  # ────────────────────────────────────────────────────────────
  deploy-dev:
    name: Build & Deploy to Dev
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: flutter-checks

    steps:
      - uses: actions/checkout@v4

      - name: Checkout OrignaBase SDK
        uses: actions/checkout@v4
        with:
          repository: yunior123/orignabase
          token: ${{ secrets.ORIGNABASE_REPO_TOKEN }}
          path: orignabase

      - name: Symlink OrignaBase at sibling path
        run: ln -sfn "$GITHUB_WORKSPACE/orignabase" "$GITHUB_WORKSPACE/../orignabase"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable
          cache: true

      - name: Build Flutter web (debug, FORCE_SEMANTICS for E2E)
        run: |
          cd origna_gta
          flutter build web --debug \
            --dart-define=ENVIRONMENT=dev \
            --dart-define=ORIGNABASE_URL=https://api.dev.orignagta.ca \
            --dart-define=FORCE_SEMANTICS=true \
            --no-tree-shake-icons

      - name: Inject Turnstile site key (dev always-pass key)
        run: sed -i "s|__TURNSTILE_SITE_KEY__|1x00000000000000000000AA|g" origna_gta/build/web/index.html || true

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 204.168.137.16 >> ~/.ssh/known_hosts

      - name: Deploy to dev VPS
        run: |
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          REMOTE_BASE="/var/www/orignagta/dev"
          RELEASE_DIR="${REMOTE_BASE}/releases/${TIMESTAMP}"
          ssh root@204.168.137.16 "mkdir -p ${RELEASE_DIR}"
          rsync -az --delete origna_gta/build/web/ "root@204.168.137.16:${RELEASE_DIR}/"
          ssh root@204.168.137.16 "ln -sfn ${RELEASE_DIR} ${REMOTE_BASE}/current"
          echo "Deployed release ${TIMESTAMP} to dev"

      - name: Wait for dev site to be ready
        run: |
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://dev.orignagta.ca || true)
            if [ "$STATUS" = "200" ]; then
              echo "Dev site ready (HTTP $STATUS)"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS — retrying in 10s..."
            sleep 10
          done
          echo "Dev site did not become ready in time" && exit 1

  # ────────────────────────────────────────────────────────────
  # Job 3: Playwright E2E (4 parallel shards)
  # Each shard runs ~14 specs with 2 workers = ~16 parallel contexts
  # ────────────────────────────────────────────────────────────
  e2e:
    name: E2E Shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: deploy-dev

    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: e2e/package-lock.json

      - name: Install E2E dependencies
        run: cd e2e && npm ci

      - name: Install Playwright Chromium
        run: cd e2e && npx playwright install chromium --with-deps

      - name: Run Playwright shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
        env:
          E2E_TARGET_URL: https://dev.orignagta.ca
          CI: "true"
          CI_SHARD: ${{ matrix.shardIndex }}
        run: |
          cd e2e && npx playwright test \
            --config=playwright.config.ci.ts \
            --project=chromium \
            --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-shard-${{ matrix.shardIndex }}
          path: e2e/test-results/
          retention-days: 7

  # ────────────────────────────────────────────────────────────
  # Job 4: Notify on failure
  # ────────────────────────────────────────────────────────────
  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [flutter-checks, deploy-dev, e2e]
    if: failure()

    steps:
      - name: Send failure email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "❌ CD Failed: Deploy + E2E on main"
          to: support@orignagta.ca
          from: GitHub Actions <${{ secrets.MAIL_USERNAME }}>
          body: |
            Workflow: CD — Deploy Dev + E2E Tests
            Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
