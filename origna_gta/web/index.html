<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Origna GTA – Your marketplace for buying and selling across the Greater Toronto Area and all of Canada. Discover products, connect with sellers, and shop securely.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Origna GTA">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Origna GTA</title>
  <link rel="manifest" href="manifest.json">

  <!-- Stripe JS (defer to not block initial paint) -->
  <script src="https://js.stripe.com/v3/" defer></script>
  <!-- Guard: prevents passkeys_web plugin from crashing if bundle.js hasn't loaded yet.
       Stubs all 7 methods from interop.dart; real SDK overwrites on production load. -->
  <script>
    if (typeof window.PasskeyAuthenticator === 'undefined') {
      window.PasskeyAuthenticator = {
        init: function() {},
        register: function() { return Promise.reject('passkeys not loaded'); },
        login: function() { return Promise.reject('passkeys not loaded'); },
        cancelCurrentAuthenticatorOperation: function() {},
        isUserVerifyingPlatformAuthenticatorAvailable: function() { return Promise.resolve(false); },
        isConditionalMediationAvailable: function() { return Promise.resolve(false); },
        hasPasskeySupport: function() { return false; }
      };
    }
  </script>
  <!-- Passkeys Web SDK (required by passkeys_web package for WebAuthn/FIDO2) -->
  <script src="https://github.com/corbado/flutter-passkeys/releases/download/2.4.0/bundle.js" type="application/javascript"></script>
</head>
<body>
  <!-- Logo shown while Flutter loads — no fixed positioning, Flutter canvas paints over it -->
  <div id="loading" style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:#fff;">
    <img src="splash/img/light-1x.png" alt="Origna GTA" width="120" height="120" style="object-fit:contain;">
    <div style="margin-top:24px;width:140px;height:3px;background:#e8e8e8;border-radius:3px;overflow:hidden;">
      <div style="height:100%;width:40%;background:#1a1a2e;border-radius:3px;animation:l 1s ease-in-out infinite;"></div>
    </div>
    <style>@keyframes l{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}</style>
  </div>

  <!-- SEO: legal links visible to crawlers before Flutter canvas loads -->
  <nav aria-label="Legal" style="position:absolute;bottom:0;left:0;right:0;text-align:center;padding:8px;font-family:sans-serif;font-size:12px;z-index:0;">
    <a href="/privacy-policy" style="color:#555;margin:0 8px;">Privacy Policy</a>
    <a href="/terms-of-service" style="color:#555;margin:0 8px;">Terms of Service</a>
    <span style="color:#999;">&copy; 2026 Origna GTA</span>
  </nav>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
