<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Origna GTA – Your marketplace for buying and selling across the Greater Toronto Area and all of Canada. Discover products, connect with sellers, and shop securely.">


  <!-- Required by google_sign_in_web (GIS SDK) for Google Sign-In on web.
       The client ID is injected at build time by CI/CD (sed placeholder replacement).
       For local dev: replace __GOOGLE_WEB_CLIENT_ID__ with your actual OAuth 2.0 Web Client ID
       from https://console.cloud.google.com/apis/credentials
       Authorized JS origins must include: https://orignagta-dev.web.app, https://dev.orignagta.ca, http://localhost -->
  <meta name="google-signin-client_id" content="__GOOGLE_WEB_CLIENT_ID__">
  <!-- Referrer policy required for Google OAuth redirect flows -->
  <meta name="referrer" content="no-referrer-when-downgrade">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Origna GTA">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Origna GTA</title>
  <link rel="manifest" href="manifest.json">

  <!-- Stripe JS (defer to not block initial paint) -->
  <script src="https://js.stripe.com/v3/" defer></script>
  <!-- Guard: prevents passkeys_web plugin from crashing if bundle.js hasn't loaded yet.
       Stubs all 7 methods from interop.dart; real SDK overwrites on production load. -->
  <script>
    if (typeof window.PasskeyAuthenticator === 'undefined') {
      window.PasskeyAuthenticator = {
        init: function() {},
        register: function() { return Promise.reject('passkeys not loaded'); },
        login: function() { return Promise.reject('passkeys not loaded'); },
        cancelCurrentAuthenticatorOperation: function() {},
        isUserVerifyingPlatformAuthenticatorAvailable: function() { return Promise.resolve(false); },
        isConditionalMediationAvailable: function() { return Promise.resolve(false); },
        hasPasskeySupport: function() { return false; }
      };
    }
  </script>
  <!-- Passkeys Web SDK (required by passkeys_web package for WebAuthn/FIDO2) -->
  <script src="https://github.com/corbado/flutter-passkeys/releases/download/2.4.0/bundle.js" type="application/javascript"></script>

  <!-- Cloudflare Turnstile — invisible widget for bot protection on registration.
       Site key: injected via __TURNSTILE_SITE_KEY__ at build time (CI/CD replaces placeholder).
       Dev fallback: 1x00000000000000000000AA (always passes — Cloudflare test key).
       Mobile/desktop: this widget never runs — App Check handles attestation there. -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" defer></script>
  <script>
    (function () {
      // Site key: replaced by build script (sed) per env.
      // Dev: 1x00000000000000000000AA (always-pass), Staging/Prod: real keys.
      var SITE_KEY = '__TURNSTILE_SITE_KEY__';

      var _tokenResolvers = [];
      var _currentToken = null;
      var _widgetId = null;

      function _renderWidget() {
        if (typeof window.turnstile === 'undefined') {
          setTimeout(_renderWidget, 200);
          return;
        }
        var container = document.getElementById('cf-turnstile-container');
        if (!container) return;
        _widgetId = window.turnstile.render(container, {
          sitekey: SITE_KEY,
          size: 'normal',
          appearance: 'execute',
          execution: 'execute',
          callback: function (token) {
            _currentToken = token;
            _tokenResolvers.forEach(function (resolve) { resolve(token); });
            _tokenResolvers = [];
          },
          'error-callback': function () {
            _currentToken = null;
            _tokenResolvers.forEach(function (resolve) { resolve(null); });
            _tokenResolvers = [];
          },
        });
      }

      // Called by Dart: returns a Promise that resolves with the token (or null).
      window._getTurnstileToken = function () {
        return new Promise(function (resolve) {
          if (_currentToken) {
            resolve(_currentToken);
          } else {
            _tokenResolvers.push(resolve);
            // Trigger challenge execution if widget already rendered
            if (_widgetId !== null && window.turnstile) {
              window.turnstile.execute(_widgetId);
            }
          }
        });
      };

      // Called by Dart after a failed registration attempt so a fresh token is issued.
      window._resetTurnstile = function () {
        _currentToken = null;
        if (_widgetId !== null && window.turnstile) {
          window.turnstile.reset(_widgetId);
        }
      };

      // Render after Turnstile SDK loads
      document.addEventListener('DOMContentLoaded', function () {
        _renderWidget();
      });
    })();
  </script>
  <style>
    html, body {
      overscroll-behavior-y: none;
      overscroll-behavior-x: none;
      background: #0F0F1E;
    }

    body {
      margin: 0;
    }

    @keyframes splash-load {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(310%); }
    }
  </style>
</head>
<body>
  <div id="splash" style="position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at top right,rgba(123,147,255,0.20),transparent 28%),radial-gradient(circle at bottom left,rgba(92,225,230,0.10),transparent 34%),linear-gradient(160deg,#0B1022 0%,#171C47 46%,#5E6AD2 100%);transition:opacity 250ms ease;">
    <div style="width:min(88vw,420px);text-align:center;color:white;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">
      <div style="width:104px;height:104px;margin:0 auto 24px;border-radius:30px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(255,255,255,0.14),rgba(255,255,255,0.06));border:1px solid rgba(255,255,255,0.18);backdrop-filter:blur(14px);box-shadow:0 24px 60px rgba(14,19,48,0.35),inset 0 1px 0 rgba(255,255,255,0.16);">
        <img src="icons/Icon-192.png" alt="Origna GTA" style="width:60px;height:60px;object-fit:contain;filter:drop-shadow(0 10px 22px rgba(0,0,0,0.20));">
      </div>
      <h1 style="margin:0;font-size:30px;font-weight:800;letter-spacing:0.08em;text-transform:uppercase;color:rgba(255,255,255,0.97);">Origna GTA</h1>
      <p style="margin:12px auto 0;max-width:340px;font-size:13px;line-height:1.6;color:rgba(255,255,255,0.68);letter-spacing:0.01em;">Marketplace commerce with a cleaner, faster launch experience across the Greater Toronto Area and all of Canada.</p>
      <div style="width:min(70vw,240px);height:4px;margin:20px auto 0;border-radius:999px;overflow:hidden;background:rgba(255,255,255,0.12);">
        <div style="width:50%;height:100%;border-radius:999px;background:linear-gradient(90deg,#7B93FF,#9FAEFF,#5CE1E6);animation:splash-load 1.15s ease-in-out infinite;"></div>
      </div>
    </div>
  </div>
  <!-- Cloudflare Turnstile invisible widget mount point (hidden, 0×0) -->
  <div id="cf-turnstile-container" style="position:absolute;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none;" aria-hidden="true"></div>

  <!-- SEO: legal links visible to crawlers before Flutter canvas loads -->
  <nav aria-label="Legal" style="position:absolute;bottom:0;left:0;right:0;text-align:center;padding:8px;font-family:sans-serif;font-size:12px;z-index:0;">
    <a href="/privacy-policy" style="color:#555;margin:0 8px;">Privacy Policy</a>
    <a href="/terms-of-service" style="color:#555;margin:0 8px;">Terms of Service</a>
    <span style="color:#999;">&copy; 2026 Origna GTA</span>
  </nav>

  <script src="flutter_bootstrap.js" async></script>
<script>
(function () {
function removeSplash() {
var el = document.getElementById('splash');
if (!el) return;
el.style.opacity = '0';
el.style.pointerEvents = 'none';
setTimeout(function () { el.remove(); }, 260);
}

window.addEventListener('flutter-first-frame', removeSplash);
setTimeout(removeSplash, 8000);

// bfcache guard: when browser restores page from back-forward cache,
// the splash may reappear. Remove it immediately.
window.addEventListener('pageshow', function (event) {
if (event.persisted) {
removeSplash();
}
});

var touchStartY = 0;
window.addEventListener('touchstart', function (event) {
if (event.touches.length !== 1) return;
touchStartY = event.touches[0].clientY;
}, { passive: true });

window.addEventListener('touchmove', function (event) {
if (event.touches.length !== 1) return;
var scroller = document.scrollingElement || document.documentElement;
var currentY = event.touches[0].clientY;
var isPullingDown = currentY > touchStartY + 12;
if (isPullingDown && scroller && scroller.scrollTop <= 0) {
event.preventDefault();
}
}, { passive: false });
})();
</script>
</body>
</html>
