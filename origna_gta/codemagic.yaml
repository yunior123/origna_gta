workflows:
  flutter-quality:
    name: Flutter Quality Gate
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: default
      xcode: latest
      cocoapods: default
    scripts:
      - name: Checkout OrignaBase SDK
        script: |
          cd "$CM_BUILD_DIR/.."
          git clone https://$ORIGNABASE_REPO_TOKEN@github.com/yunior123/orignabase.git orignabase 2>/dev/null || true
      - name: Flutter dependencies
        script: |
          flutter pub get
      - name: Flutter analyze
        script: |
          flutter analyze --no-fatal-infos
      - name: Flutter tests
        script: |
          flutter test --exclude-tags golden --reporter=compact

  android-release:
    name: Android Release (Play Store)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: default
      groups:
        - android_credentials
      vars:
        PACKAGE_NAME: "ca.orignagta.origna_gta"
    scripts:
      - name: Checkout OrignaBase SDK
        script: |
          cd "$CM_BUILD_DIR/.."
          git clone https://$ORIGNABASE_REPO_TOKEN@github.com/yunior123/orignabase.git orignabase 2>/dev/null || true
      - name: Set up keystore
        script: |
          echo $CM_KEYSTORE | base64 --decode > "$CM_BUILD_DIR/android/upload-keystore.jks"
          cat <<EOF > "$CM_BUILD_DIR/android/key.properties"
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=../upload-keystore.jks
          EOF
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Build Android App Bundle (AAB)
        script: |
          flutter build appbundle --release \
            --dart-define=ENVIRONMENT=production \
            --dart-define=ORIGNABASE_URL=https://api.orignagta.ca \
            --build-name=1.0.0 \
            --build-number=$BUILD_NUMBER
    artifacts:
      - build/app/outputs/bundle/release/app-release.aab
      - build/app/outputs/flutter-apk/app-release.apk
      - build/**/outputs/mapping/**/mapping.txt

  ios-release:
    name: iOS Release (No App Store)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: default
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "ca.orignagta.origna_gta"
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
    scripts:
      - name: Checkout OrignaBase SDK
        script: |
          cd "$CM_BUILD_DIR/.."
          git clone https://$ORIGNABASE_REPO_TOKEN@github.com/yunior123/orignabase.git orignabase 2>/dev/null || true
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Install pods
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Build unsigned iOS App
        script: |
          flutter build ios --release \
            --dart-define=ENVIRONMENT=production \
            --dart-define=ORIGNABASE_URL=https://api.orignagta.ca \
            --build-name=1.0.0 \
            --build-number=$BUILD_NUMBER \
            --no-codesign
    artifacts:
      - build/ios/iphoneos/Runner.app
