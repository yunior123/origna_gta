workflows:
  flutter-quality:
    name: Flutter Quality Gate
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: default
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Flutter dependencies
        script: |
          cd origna_gta
          flutter pub get
      - name: Flutter analyze
        script: |
          cd origna_gta
          flutter analyze --no-fatal-infos
      - name: Flutter tests
        script: |
          cd origna_gta
          flutter test --exclude-tags golden --reporter=compact
      - name: Rust clippy
        script: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source "$HOME/.cargo/env"
          cd orignabase
          cargo clippy -- -D warnings
      - name: Rust tests
        script: |
          source "$HOME/.cargo/env"
          cd orignabase
          cargo test

  android-release:
    name: Android Release (Play Store)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: default
      groups:
        - android_credentials
      vars:
        PACKAGE_NAME: "ca.orignagta.origna_gta"
    scripts:
      - name: Set up keystore
        script: |
          echo $CM_KEYSTORE | base64 --decode > "$CM_BUILD_DIR/origna_gta/android/upload-keystore.jks"
          cat <<EOF > "$CM_BUILD_DIR/origna_gta/android/key.properties"
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=../upload-keystore.jks
          EOF
      - name: Get Flutter packages
        script: |
          cd origna_gta
          flutter pub get
      - name: Run tests
        script: |
          cd origna_gta
          flutter test --exclude-tags golden --reporter=compact
      - name: Build Android App Bundle (AAB)
        script: |
          cd origna_gta
          flutter build appbundle --release \
            --dart-define=ENVIRONMENT=production \
            --dart-define=ORIGNABASE_URL=https://api.orignagta.ca \
            --build-name=1.0.0 \
            --build-number=$BUILD_NUMBER
    artifacts:
      - origna_gta/build/app/outputs/bundle/release/app-release.aab
      - origna_gta/build/app/outputs/flutter-apk/app-release.apk
      - origna_gta/build/**/outputs/mapping/**/mapping.txt

  ios-release:
    name: iOS Release (TestFlight)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: default
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: "ca.orignagta.origna_gta"
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
    scripts:
      - name: Get Flutter packages
        script: |
          cd origna_gta
          flutter pub get
      - name: Install pods
        script: |
          cd origna_gta
          find . -name "Podfile" -execdir pod install \;
      - name: Run tests
        script: |
          cd origna_gta
          flutter test --exclude-tags golden --reporter=compact
      - name: Build unsigned iOS App
        script: |
          cd origna_gta
          flutter build ios --release \
            --dart-define=ENVIRONMENT=production \
            --dart-define=ORIGNABASE_URL=https://api.orignagta.ca \
            --build-name=1.0.0 \
            --build-number=$BUILD_NUMBER \
            --no-codesign
    artifacts:
      - origna_gta/build/ios/iphoneos/Runner.app
